      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="run" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="960" y2="0">
      <stop offset="0" stop-color="#E2621C" stop-opacity="0"/>
